# Is Statiku up? Every half hour GitHub asks the service, which asks its database (/healthz?deep=1). When it doesn't
# answer three times in a row, an issue labelled "down" is opened, which GitHub emails to whoever watches this
# repository; the issue is closed when Statiku answers again, which is one more email. The run itself never fails:
# GitHub would email about every failed run, every half hour for as long as an outage lasts. Every half hour, because this repository is private and
# GitHub counts each run as a minute: about 1,500 of the 2,000 free minutes a month. Render emails about crashes too.
# The address is the repository variable STATIKU_URL, or else statiku.victorabuchi.com.
name: Uptime
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
concurrency: uptime
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask Statiku
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ vars.STATIKU_URL || 'https://statiku.victorabuchi.com' }}
        run: |
          open=$(gh issue list --label down --state open --json number --jq '.[0].number // empty')
          # Three tries a minute apart, so a deploy or a blip isn't taken for an outage.
          for try in 1 2 3; do
            if answer=$(curl -fsS --max-time 20 "$URL/healthz?deep=1" 2>&1); then
              if [ -n "$open" ]; then gh issue close "$open" --comment "Statiku is answering again: $answer"; fi
              exit 0
            fi
            [ "$try" = 3 ] || sleep 60
          done
          if [ -z "$open" ]; then
            gh label create down --color B60205 --description "Statiku isn't answering" 2>/dev/null || true
            gh issue create --label down --title "Statiku is down" --body "$URL/healthz?deep=1 didn't answer three times in a row. Last answer: $answer"
          fi
          echo "Statiku isn't answering: $answer"
          exit 0
